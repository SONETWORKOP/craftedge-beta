# subpacks: Featherlight, Reimagined, Silver Drift, Pixel Cumulus,
# Cottoncloud Classics, Naresh Painted, Silk Horizon (default).

[[subpack]]
define = "NO_REFLECTIONS"
materials = ["RenderChunk", "Clouds", "Sky"]
description = '''
Featherlight Clouds
Soft pixel-noise clouds with lighter detail. Reflections are off for maximum
performance.
'''

[[subpack]]
define = "REIMAGINED_CLOUDS"
materials = ["RenderChunk", "Clouds", "Sky"]
description = '''
Reimagined Clouds 2.0
Volumetric mesh clouds with warm dawn silver linings, moonlit edges and a
painterly sunset glow.
'''

[[subpack]]
define = "MEDIUM"
materials = ["RenderChunk", "Clouds", "Sky"]
description = '''
Silver Drift Clouds
Full-detail pixel-noise clouds with soft silver shading. Heavy water reflections
are trimmed for smoother performance.
'''

[[subpack]]
define = "BLOCKY_CLOUDS"
materials = ["RenderChunk", "Clouds", "Sky"]
description = '''
Pixel Cumulus Clouds
Bold, blocky pixel clouds with a heavy, sculpted look for dramatic skies.
'''

[[subpack]]
define = "DEFAULT"
materials = []
description = '''
Cottoncloud Classics
The classic rounded clouds with clean, soft edges and balanced shading.
'''

[[subpack]]
define = "NARESH_CLOUDS"
materials = ["Sky"]
description = '''
Messy Clouds
5-octave painted clouds with high wisps of cirrus and a hand-painted sky feel.
'''

[[subpack]]
define = "BICUBIC_CLOUDS"
materials = ["RenderChunk", "Sky"]
description = '''
Silk Horizon Clouds (Default)
Smooth bicubic painted clouds with a silky horizon and realistic depth.
'''
